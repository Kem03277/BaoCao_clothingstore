spring.application.name=clothingstore
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/clothingstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=10h
security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:1440}
security.password-migration.enabled=${PASSWORD_MIGRATION_ENABLED:false}
security.jwt.secret=${JWT_SECRET:R/Fmb6m9P4trY/P3a0iUbZWdzKPcrBQAksP/sHwItwE=}
app.seed.enabled=true

vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.backend-base-url=${VNPAY_BACKEND_BASE_URL:http://localhost:8080}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/}
vnpay.expiration-scan-ms=${VNPAY_EXPIRATION_SCAN_MS:60000}

# Spring Mail Configuration (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Store Admin Notification Email
store.mail.admin-email=${ADMIN_NOTIFICATION_EMAIL:}
